# Cross builds for Windows with MinGW (cargo build --release --target x86_64-pc-windows-gnu).
# UnRAR includes <PowrProf.h>; MinGW ships powrprof.h, so a correctly cased shim sits in mingw-include.
[target.x86_64-pc-windows-gnu]
# Static C runtime: no libwinpthread-1.dll next to the exe.
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-arg=-static"]

# Native Windows builds (MSVC, docs/building-windows.md): the C runtime linked in, so no VC++ redistributable.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[env]
CPLUS_INCLUDE_PATH = { value = ".cargo/mingw-include", relative = true }
# SDL2's bundled build (sdl2-sys, the Linux pad fallback): its CMakeLists asks for CMake < 3.5, which CMake 4 refuses
# without the policy minimum; the toolchain file leaves out SDL's audio and video.
CMAKE_POLICY_VERSION_MINIMUM = "3.5"
SDL2_TOOLCHAIN = { value = "release/sdl2-pads.cmake", relative = true }
