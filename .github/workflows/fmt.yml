# rustfmt on every push to master and every pull request; fails when `cargo fmt --all -- --check` finds a file that
# isn't formatted (settings in rustfmt.toml). One Linux runner is enough: formatting is platform-independent.
name: rustfmt

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: fmt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
