name = "Gear Stats"
version = "1.0.1"
description = "The totals of the stats on everything you wear, from the items' own descriptions and their augments (the gear stat add-ons)."
permissions = []

[settings.on]
type = "bool"
default = true
label = "Gear Stats"
help = "//gearstats opens a window with the totals of your worn gear's stats (DEF, attributes, Accuracy, Haste...), conditional lines (pet, set, latent, weather, day) left out."

[commands.gearstats]
help = "Opens or closes the Gear Stats window."
usage = ""
