name = "Key Commands"
version = "1.0.4"
description = "Binds keys to command lines and makes short aliases for long commands, kept per character (the bind and alias add-ons)."
permissions = ["actions"]

[settings.on]
type = "bool"
default = true
label = "Key Commands"
help = "//bind <key> <line> (keys like f9, ctrl+1, alt+shift+q), //unbind <key>, //binds; //alias <name> <line> makes /name run the line, //unalias <name>, //aliases."

[commands.bind]
help = "Binds a key to a command line."
args = "<key> <line>"

[commands.unbind]
help = "Takes a key's bind off."
args = "<key>"

[commands.binds]
help = "Lists your key binds."
args = ""

[commands.alias]
help = "Makes a short name run a longer command line."
args = "<name> <line>"

[commands.unalias]
help = "Removes an alias."
args = "<name>"

[commands.aliases]
help = "Lists your aliases."
args = ""
