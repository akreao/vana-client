name = "Macro Book Switch"
version = "1.0.3"
description = "Turns the macro palette to the book and set you keep for each job when the job changes (the macro changer add-ons)."
permissions = ["automation"]

[settings.on]
type = "bool"
default = false
label = "Macro Book Switch"
help = "When your job changes, turns the macro palette to the book and set saved for it with //macros save (or to a book titled with the job, such as WAR)."

[commands.macros]
help = "The macro book and set kept for each job."
forms = [
  { args = "save [sub]", help = "Keeps the palette's book and set for this job (or this sub job)." },
  { args = "forget [sub]", help = "Forgets them." },
  { args = "list", help = "Lists what is kept." },
]
