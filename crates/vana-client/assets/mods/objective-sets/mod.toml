name = "Objective Sets"
version = "1.0.2"
description = "Saves the Records of Eminence objectives you have set as named sets and puts a set back with one command (the objective set add-ons).\n\n//roeset save <name>\n//roeset <name>\n//roeset list\n//roeset delete <name>\n//roeshow"
permissions = ["actions"]

[settings.on]
type = "bool"
default = true
label = "Objective Sets"
help = "//roeset save <name> keeps the objectives set now; //roeset <name> removes the others and sets those, a second apart (removing loses an objective's progress); //roeset list, //roeset delete <name>."
