name = "Look Changer"
version = "1.0.1"
description = "Changes how characters look on your screen only: your race, face and gear, a target's look copied, one race for everyone else (the dress-up add-ons)."
permissions = []

[settings.on]
type = "bool"
default = true
label = "Look Changer"
help = "//look race <race>, //look face <1a..8b>, //look <slot> <item | none | own>, //look copy [name], //look others <race | own>, //look reset. Only your screen changes."

[commands.look]
help = "Changes how characters look, on your screen only."
forms = [
  { args = "race <race>", help = "Your race." },
  { args = "face <1a..8b>", help = "Your face." },
  { args = "<slot> <item | none | own>", help = "A piece of your gear." },
  { args = "copy [name]", help = "Copies a player's look (your target's)." },
  { args = "others <race | own>", help = "One race for everyone else." },
  { args = "reset", help = "Your own look back." },
]
