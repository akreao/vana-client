name = "Loot Rules"
version = "1.0.2"
description = "Lots, passes and drops treasure by your lists (the treasury and loot add-ons)."
permissions = ["automation"]

[settings.on]
type = "bool"
default = false
label = "Loot Rules"
help = "Lots on treasure pool items on your Lot list and passes those on your Pass list. //loot opens the lists."

[settings.pass_rest]
type = "bool"
default = false
label = "Pass Everything Else"
help = "Passes every pool item that is not on the Lot list."

[settings.drop]
type = "bool"
default = true
label = "Drop Listed Items"
help = "Drops items on the Drop list as soon as they reach your inventory."

[settings.stack]
type = "bool"
default = false
label = "Stack Loot"
help = "Sorts the inventory after loot arrives, so its stacks merge."

[commands.loot]
help = "Lots, passes or drops treasure by your lists."
args = "[lot | pass | drop] [add | remove] <item>"
params = [{ name = "lot", type = "enum", options = ["lot", "pass", "drop"] }, { name = "add", type = "enum", options = ["add", "remove"] }, { name = "item", type = "item" }]
forms = [
  { args = "list", help = "Lists your rules." },
]
