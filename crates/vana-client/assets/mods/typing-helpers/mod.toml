name = "Typing Helpers"
version = "1.0.1"
description = "[[words]] in a chat line become the auto-translate phrase, and <tags> such as <star> or <note> become the game's symbols (the translate and chars add-ons)."
permissions = []

[settings.on]
type = "bool"
default = true
label = "Typing Helpers"
help = "In what you type: [[Hello!]] becomes that auto-translate phrase; <star>, <note>, <heart>, <arrow> and the like become the game's symbols; <me>-style targets are left alone."
