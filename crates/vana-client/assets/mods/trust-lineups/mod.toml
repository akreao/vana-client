name = "Trust Lineups"
version = "1.0.3"
description = "Saves the trusts you call as named lineups and calls a lineup with one command (the trust set add-ons).\n\n//trusts <lineup>\n//trusts save <lineup> [trust, trust...]\n//trusts list\n//trusts delete <lineup>"
permissions = ["actions"]

[settings.on]
type = "bool"
default = true
label = "Trust Lineups"
help = "//trusts save <name> keeps the trusts in your party as a lineup; //trusts <name> calls them one after another; //trusts list, //trusts delete <name>."
