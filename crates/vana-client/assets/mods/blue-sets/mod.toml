name = "Blue Magic Sets"
version = "1.0.2"
description = "Saves your set blue magic as named sets and puts a set back with one command; a codex of every blue spell and what teaches it; a call when a monster readies a move that teaches one you lack (the blue magic add-ons)."
permissions = ["actions"]

[settings.on]
type = "bool"
default = true
label = "Blue Magic Sets"
help = "As a Blue Mage: //blu save <name> keeps the spells set now; //blu <name> sets them again; //blu list, //blu delete <name>; //blu codex shows every blue spell and what teaches it."

[settings.alert]
type = "bool"
default = true
label = "Learnable Moves"
help = "As a Blue Mage: a line when a monster readies a move that teaches a blue spell you have not learned."

[settings.alert_sound]
type = "bool"
default = true
label = "Learnable Moves Call"
help = "A call sound with that line, and when you learn a blue spell."

[commands.blu]
help = "Your blue magic sets; with a name, sets that set."
args = "<name>"
forms = [
  { args = "save <name>", help = "Saves your set blue magic as a set." },
  { args = "list", help = "Lists your sets." },
  { args = "delete <name>", help = "Deletes a set." },
  { args = "codex", help = "Opens the codex of every blue spell and what teaches it." },
]
