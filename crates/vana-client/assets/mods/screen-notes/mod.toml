name = "Screen Notes"
version = "1.0.1"
description = "Puts your notes on the screen by command, where you drag them (the text add-ons)."
permissions = []

[settings.on]
type = "bool"
default = true
label = "Screen Notes"
help = "//note <name> <text> puts a note on the screen (drag it to move it); //note <name> removes it; //notes lists them."

[commands.note]
help = "Puts a named note on the screen."
args = "<name> <text>"
forms = [
  { args = "<name>", help = "Removes it." },
]

[commands.notes]
help = "Lists your screen notes."
args = ""
