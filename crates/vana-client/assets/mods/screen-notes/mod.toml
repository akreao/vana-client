name = "Screen Notes"
version = "1.0.2"
description = "Puts your own notes on the screen by command, where you drag them (the text add-ons).\n\n//note <name> <text>\n//note <name> (removes it)\n//notes"
permissions = []

[settings.on]
type = "bool"
default = true
label = "Screen Notes"
help = "//note <name> <text> puts a note on the screen (drag it to move it); //note <name> removes it; //notes lists them."
