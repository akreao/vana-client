name = "XIFO HC Icons"
version = "1.0.2"
description = "The hardcore mode's shield (Iron, Steel, Silver, Random) beside party members in the modern party list, on an XI: Forever Offline server."
authors = ["vana-client"]

[settings.on]
type = "bool"
default = true
label = "XIFO HC Icons"
help = "Shows the hardcore shields beside the modern party list's rows (the game already shows them beside names). Needs XIFO Link."

[commands.hcicons]
help = "Turns the party list's hardcore shields on or off."
args = ""
forms = [
  { args = "list", help = "The hardcore characters known in this area." },
  { args = "refresh", help = "Asks the server again." },
]
