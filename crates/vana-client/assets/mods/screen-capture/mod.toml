name = "Screen Capture"
version = "1.0.1"
description = "Screenshots filed in folders by character and zone, and video recording by command (the screenshot organizer and capture add-ons). Commands: //shot, //record, //record stop."
permissions = []

[settings.on]
type = "bool"
default = true
label = "Screen Capture"
help = "//shot saves a screenshot in screenshots/<character>/<zone>/; //record starts a video, //record stop ends it (videos need ffmpeg)."
