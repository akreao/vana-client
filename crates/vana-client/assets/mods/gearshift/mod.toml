name = "Gearshift"
version = "0.1.2"
description = "Swaps gear around your actions from GearSwap job files and LuAshitacast and Ashitacast XML profiles, unchanged (the gear-swap add-ons).\n\n//gs: GearSwap's own commands\n//lac: LuAshitacast's own commands\n//ac: Ashitacast's own commands\n//spellcast: Spellcast's own commands\n//gearshift shows the loaded file\n//gearshift reload reads it again"
permissions = ["packets.read", "packets.write", "automation"]

[settings.on]
type = "bool"
default = true
label = "Gear Swapping"
help = "Runs your GearSwap job file, LuAshitacast profile or Ashitacast XML profile for the job you play (in this mod's data folder: gearswap/ or ashitacast/)."
