name = "Gearshift"
version = "0.1.1"
description = "Swaps gear around your actions from GearSwap job files and LuAshitacast and Ashitacast XML profiles, unchanged (the gear-swap add-ons). Commands: //gs, //lac, //ac and //spellcast take each add-on's own commands; //gearshift shows the loaded file, //gearshift reload reads it again."
permissions = ["packets.read", "packets.write", "automation"]

[settings.on]
type = "bool"
default = true
label = "Gear Swapping"
help = "Runs your GearSwap job file, LuAshitacast profile or Ashitacast XML profile for the job you play (in this mod's data folder: gearswap/ or ashitacast/)."
