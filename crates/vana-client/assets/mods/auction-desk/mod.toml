name = "Auction Desk"
version = "1.0.4"
description = "Bids and sales at the auction house by command, and your listings in the log (the auction helper add-ons)."
permissions = ["actions"]

[settings.on]
type = "bool"
default = true
label = "Auction Desk"
help = "At the auction house: //ahbuy <item> <price> [stack], //ahsell <item> <price> [stack], //ahlist. Prices take k and m (12k). The game asks before each bid and sale."

[commands.ahbuy]
help = "Bids on an item at the auction house."
args = "<item> <price> [stack]"
params = [{ name = "item", type = "item" }, { name = "price", type = "int" }, { name = "stack", type = "enum", options = ["stack"] }]

[commands.ahsell]
help = "Puts an item up for sale at the auction house."
args = "<item> <price> [stack]"
params = [{ name = "item", type = "item" }, { name = "price", type = "int" }, { name = "stack", type = "enum", options = ["stack"] }]

[commands.ahlist]
help = "Lists your auction house sales in the log."
args = ""
