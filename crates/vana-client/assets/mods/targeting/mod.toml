name = "Targeting Helpers"
version = "1.0.5"
description = "Targets by name or id, turns you toward or away from your target, and can check each monster you target (the targeting add-ons)."
permissions = ["automation"]

[settings.on]
type = "bool"
default = true
label = "Targeting Helpers"
help = "//face turns you toward your target, //face away away from it; //tgt <name or id> targets the nearest match."

[settings.check]
type = "bool"
default = false
label = "Check New Targets"
help = "Checks (/check) each monster you target, once."

[commands.tgt]
help = "Targets by name or server id."
args = "<name or server id>"

[commands.face]
help = "Turns you toward your target."
args = ""
forms = [
  { args = "away", help = "Turns you away from it." },
]
