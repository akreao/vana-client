name = "Effect Remover"
version = "1.0.2"
description = "Cancels your status effects by name or id from a command, for macros (the cancel add-ons).\n\n//cancel <effect>[, <effect>...] (a name, a name with *, or an id)"
permissions = ["actions"]

[settings.on]
type = "bool"
default = true
label = "Effect Remover"
help = "//cancel <effect> removes a status effect you have (a name, a name with *, or an id; several separated by commas). Works in macros too: //cancel Sneak."
