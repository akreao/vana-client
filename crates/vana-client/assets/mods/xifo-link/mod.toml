name = "XIFO Link"
version = "1.2.0"
description = "Talks to an XI: Forever Offline server for the XIFO mods: says their commands one at a time and hides the server's replies."
authors = ["vana-client"]
permissions = ["automation"]

[settings.on]
type = "bool"
default = true
label = "XIFO Link"
help = "Needed by the XI: Forever Offline mods (XIFO Squad, XIFO Gambits). It says nothing unless one of them asks."
