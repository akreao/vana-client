name = "Automaton Sets"
version = "1.0.2"
description = "Saves your automaton's head, frame and attachments as named sets and puts a set on with one command (the automaton set add-ons).\n\n//automaton save <name>\n//automaton <name>\n//automaton list\n//automaton delete <name>"
permissions = ["actions"]

[settings.on]
type = "bool"
default = true
label = "Automaton Sets"
help = "As a Puppetmaster: //automaton save <name> keeps the head, frame and attachments; //automaton <name> puts them on (the automaton must not be out); //automaton list, //automaton delete <name>."
