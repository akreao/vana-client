name = "Automaton Sets"
version = "1.0.1"
description = "Saves your automaton's head, frame and attachments as named sets and puts a set on with one command (the automaton set add-ons)."
permissions = ["actions"]

[settings.on]
type = "bool"
default = true
label = "Automaton Sets"
help = "As a Puppetmaster: //automaton save <name> keeps the head, frame and attachments; //automaton <name> puts them on (the automaton must not be out); //automaton list, //automaton delete <name>."

[commands.automaton]
help = "Your automaton's named sets."
args = "<name>"
forms = [
  { args = "save <name>", help = "Saves the automaton's head, frame and attachments as a set." },
  { args = "list", help = "Lists your sets." },
  { args = "delete <name>", help = "Deletes a set." },
]
