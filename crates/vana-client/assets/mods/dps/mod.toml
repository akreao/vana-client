name = "DPS"
version = "1.0.1"
authors = ["vana-client"]
description = "The damage your party dealt since the first hit after a reset.\n\n/dps\n/dps reset starts again"

[settings.window]
type = "bool"
default = false
label = "Damage Meter"
help = "Shows the party's damage, each member's share and damage a second, in a window on a screen edge while you fight (the damage meter add-ons). /dps reset starts again."
