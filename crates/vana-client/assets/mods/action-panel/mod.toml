name = "Action Panel"
version = "1.0.6"
description = "A window of everything your jobs can use now: magic by school, job abilities, weapon skills and pet commands, with costs and recasts; a click uses one; //actions opens it (the action menu add-ons)."
permissions = ["actions"]

[settings.on]
type = "bool"
default = true
label = "Action Panel"
help = "//actions opens or closes it. A click on a row uses it as a macro line would: on yourself when it can only be, else through the target prompt."

[commands.actions]
help = "Opens the Action Panel window."
args = ""
