name = "Map Notes"
version = "1.0.2"
description = "Notes pinned to places on a zone's map, your party and the monsters you track, marked on the Map Overlay (the map marker add-ons)."
permissions = []

[settings.on]
type = "bool"
default = true
label = "Map Notes"
help = "On the Map Overlay (Ctrl or Alt + O): your notes (//mapnote add <text> where you stand; list, del <n>), party members, and what //mapnote track <name> follows."

[settings.party]
type = "bool"
default = true
label = "Party on the Map"
help = "Party and alliance members in sight marked on the Map Overlay."

[commands.mapnote]
help = "Notes on the zone's map, and monsters to track on it."
forms = [
  { args = "add <text>", help = "Pins a note where you stand." },
  { args = "del <n>", help = "Removes a note by its number." },
  { args = "list", help = "Lists this zone's notes." },
  { args = "track <name>", help = "Marks a monster on the map." },
  { args = "untrack <name>", help = "Stops marking it." },
]
